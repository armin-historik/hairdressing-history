
name: Airtable Archive Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

concurrency:
  group: airtable-archive-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch approved archive records
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse

          base = "appQK6gnggCwfM7ze"
          table = "tblR8HotH5nj1cSvW"
          token = os.environ["AIRTABLE_TOKEN"]

          api = f"https://api.airtable.com/v0/{base}/{table}"

          def clean(value):
              return str(value or "").strip()

          def safe_url(value):
              value = clean(value)
              parsed = urllib.parse.urlparse(value)
              if parsed.scheme in ("https", "http") and parsed.netloc:
                  return value
              return ""

          records = []
          offset = None

          while True:
              params = {
                  "pageSize": 100,
                  "filterByFormula": "{Metadaten öffentlich}=1"
              }

              if offset:
                  params["offset"] = offset

              url = api + "?" + urllib.parse.urlencode(params)

              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}"
                  }
              )

              with urllib.request.urlopen(
                  request, timeout=30
              ) as response:
                  result = json.load(response)

              for item in result.get("records", []):
                  f = item.get("fields", {})

                  original_title = clean(f.get("Titel"))
                  original_description = clean(
                      f.get("Beschreibung")
                  )
                  original_source = clean(
                      f.get("Quelle / Herkunft")
                  )

                  english_title = clean(
                      f.get("Public title (EN)")
                  )
                  english_description = clean(
                      f.get("Public description (EN)")
                  )
                  english_source = clean(
                      f.get("Public source (EN)")
                  )

                  language = clean(
                      f.get("Document language")
                  ) or "Not specified"

                  record = {
                      "id": clean(f.get("Archiv-ID")),
                      "title": english_title or original_title,
                      "date": clean(f.get("Jahr / Datierung")),
                      "categories": f.get(
                          "Forschungsbereiche", []
                      ),
                      "source": english_source or original_source,
                      "description": (
                          english_description or original_description
                      ),
                      "original_url": safe_url(
                          f.get("Original-URL")
                      ),
                      "language": language,
                      "original_title": original_title,
                      "title_translated": bool(english_title),
                      "description_translated": bool(
                          english_description
                      ),
                      "source_translated": bool(english_source)
                  }

                  if (
                      f.get("PDF öffentlich") is True
                      and f.get("Öffentliche PDF-URL")
                  ):
                      pdf_url = safe_url(
                          f.get("Öffentliche PDF-URL")
                      )
                      if pdf_url:
                          record["pdf_url"] = pdf_url

                  if record["id"] and record["title"]:
                      records.append(record)

              offset = result.get("offset")
              if not offset:
                  break

          records.sort(key=lambda r: r["id"])

          os.makedirs("archiv", exist_ok=True)

          with open(
              "archiv/records.json",
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  records,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              f"Exported {len(records)} approved records."
          )
          PY

      - name: Publish archive data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archiv/records.json
          if ! git diff --cached --quiet; then
            git commit -m "Update public archive records"
            git push
          fi
